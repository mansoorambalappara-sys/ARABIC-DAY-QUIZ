<!DOCTYPE html>
<html lang="ml"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>അറബിക് ക്വിസ് ഗെയിം</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Anek+Malayalam:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cardbg:#fff;--ink:#2a1a5e;--soft:#efe9ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cardbg:#2d2357;--ink:#fff;--soft:#3d3070}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}button{font-family:inherit}.ml{display:block;direction:ltr;font-family:'Anek Malayalam','Noto Sans Malayalam',sans-serif;font-weight:600;font-size:.82rem;line-height:1.35;margin-top:4px;opacity:.9}.qm{text-align:center;font-family:'Anek Malayalam','Noto Sans Malayalam',sans-serif;font-weight:600;font-size:1.05rem;margin:-4px 0 6px;opacity:.9}
body{margin:0;min-height:100vh;font-family:'Anek Malayalam','Noto Sans Malayalam',sans-serif;color:#fff;background:linear-gradient(160deg,#2b1b6b,#7b2ff7 55%,#f357a8);background-attachment:fixed;overflow-x:hidden}
.ar{font-family:'Sakkal Majalla','Shakkal Majalla','Majalla','Amiri','Noto Naskh Arabic',serif;direction:rtl;font-weight:700}
.fl{position:fixed;font-size:2.4rem;opacity:.85;pointer-events:none;animation:fl 7s ease-in-out infinite;z-index:0}
@keyframes fl{0%,100%{transform:translateY(0) rotateY(0)}50%{transform:translateY(-26px) rotateY(180deg)}}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:16px}
h1{font-size:2.1rem;text-align:center;margin:10px 0 0;text-shadow:0 1px 0 #c9a,0 2px 0 #b89,0 3px 0 #a78,0 4px 0 #967,0 8px 14px rgba(0,0,0,.4);transform:perspective(500px) rotateX(14deg)}
.sub{text-align:center;margin:6px 0 14px;font-weight:700}
.btn{font:inherit;font-weight:800;color:#fff;border:0;border-radius:18px;padding:13px 16px;cursor:pointer;background:linear-gradient(#ffb347,#ff7a18);box-shadow:0 7px 0 #b5470a,0 12px 18px rgba(0,0,0,.35);transition:.1s;font-size:1.05rem}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #b5470a}
.btn.g{background:linear-gradient(#5ee27b,#18a845);box-shadow:0 7px 0 #0c6a27,0 12px 18px rgba(0,0,0,.35)}
.btn.b{background:linear-gradient(#5bc0ff,#2a6cf0);box-shadow:0 7px 0 #1a3f94,0 12px 18px rgba(0,0,0,.35)}
.btn.p{background:linear-gradient(#e08bff,#a233e0);box-shadow:0 7px 0 #5f1a87,0 12px 18px rgba(0,0,0,.35)}
.tabs{display:flex;gap:12px;margin-bottom:18px}.tabs .btn{flex:1;opacity:.6}.tabs .btn.on{opacity:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid .btn{padding:18px 8px}
.grid .btn span{display:block;font-size:2.3rem;animation:fl 4s ease-in-out infinite}
.card{background:var(--cardbg);color:var(--ink);border-radius:26px;padding:20px;box-shadow:0 10px 0 rgba(0,0,0,.22),0 24px 40px rgba(0,0,0,.35);transform-style:preserve-3d;transition:transform .15s}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:800}
.bar{height:14px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe259,#ffa751);transition:.4s}
.q{font-size:2.1rem;line-height:1.6;text-align:center;margin:4px 0 10px}
.mascot{font-size:3.4rem;text-align:center;animation:fl 3s ease-in-out infinite}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.opt{font-size:1.6rem;line-height:1.4;padding:14px 8px;border-radius:18px;border:0;cursor:pointer;color:var(--ink);background:var(--soft);box-shadow:0 6px 0 #b9a8f0;transition:.1s}
.opt:active{transform:translateY(4px)}
.opt.ok{background:#3ddc6a;color:#fff;box-shadow:0 6px 0 #17913b;animation:pop .5s}
.opt.no{background:#ff5a5a;color:#fff;box-shadow:0 6px 0 #b02020;animation:shake .5s}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes pop{50%{transform:scale(1.12) rotate(-2deg)}}
.say{background:none;border:0;font-size:1.8rem;cursor:pointer}
.msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9;pointer-events:none;flex-direction:column}
.msg.on{display:flex;animation:zoom 1.3s forwards}
.msg b{font-size:4.4rem;text-shadow:0 6px 0 rgba(0,0,0,.35),0 14px 24px rgba(0,0,0,.4)}.msg small{font-size:1.5rem;font-weight:800;text-shadow:0 3px 8px rgba(0,0,0,.5)}

.cf{position:fixed;top:-30px;font-size:1.8rem;z-index:8;pointer-events:none;animation:cf 2s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
.lc{height:200px;perspective:700px;cursor:pointer;margin-bottom:14px}
.lc>div{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s}
.lc.f>div{transform:rotateY(180deg)}
.lc .s{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:10px;text-align:center;font-size:1.6rem;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.lc .fr{background:var(--cardbg);color:var(--ink)}.lc .bk{background:linear-gradient(#5ee27b,#18a845);color:#fff;transform:rotateY(180deg);font-size:2rem}
.trophy{font-size:6rem;text-align:center;animation:fl 2.4s ease-in-out infinite}
.row{display:flex;gap:12px;margin-top:16px}.row .btn{flex:1}
.hint{text-align:center;font-size:.9rem;margin-top:12px;opacity:.9}

.wrap{perspective:1300px}
@keyframes in3d{from{opacity:0;transform:perspective(900px) rotateX(-65deg) translateZ(-220px)}to{opacity:1;transform:perspective(900px) rotateX(0) translateZ(0)}}
@keyframes flip3d{from{opacity:0;transform:perspective(600px) rotateY(-90deg) translateZ(-60px)}to{opacity:1;transform:perspective(600px) rotateY(0)}}
@keyframes spin3d{0%,100%{transform:rotateY(0)}50%{transform:rotateY(360deg) scale(1.15)}}
@keyframes sway{0%,100%{transform:perspective(700px) rotateY(-9deg) rotateX(4deg)}50%{transform:perspective(700px) rotateY(9deg) rotateX(-4deg)}}
@keyframes okflip{0%{transform:perspective(600px) rotateX(0)}50%{transform:perspective(600px) rotateX(180deg) scale(1.15)}100%{transform:perspective(600px) rotateX(360deg)}}
.card{animation:in3d .7s ease-out}
.mascot,.trophy,.grid .btn span{animation:spin3d 4s ease-in-out infinite}
.q.ar{text-shadow:1px 1px 0 #cbbdf5,2px 2px 0 #b3a1ee,3px 3px 0 #9b86e4,4px 6px 8px rgba(0,0,0,.35)}
.opt{animation:flip3d .6s ease-out backwards;transform-style:preserve-3d}
.opt:nth-child(2){animation-delay:.12s}.opt:nth-child(3){animation-delay:.24s}.opt:nth-child(4){animation-delay:.36s}
.opt:not(:disabled):hover{transform:translateY(-4px) perspective(600px) rotateX(10deg) translateZ(18px);box-shadow:0 12px 0 #b9a8f0,0 20px 20px rgba(0,0,0,.25)}
.opt.ok{animation:okflip .8s}
.btn:hover{transform:translateY(-3px) perspective(600px) rotateX(10deg)}.btn:active{transform:translateY(5px)}
.lc{animation:in3d .6s ease-out backwards}.lc:not(.f):hover>div{transform:rotateY(10deg) rotateX(5deg)}
.msg b{animation:sway 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
.card,.q.ar,.opt,.opt.ok,.opt.no,.lc{animation:none!important}
.opt:not(:disabled):hover{transform:none;box-shadow:0 6px 0 #b9a8f0}
.lc:not(.f):hover>div{transform:none}
.q,.q.ar,.opt,.lc .s{text-shadow:none!important}
</style></head><body>
